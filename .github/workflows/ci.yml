name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 同じブランチへの連続 push は古い実行を止める(Supabase を毎回起動するため)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # build を通すためのダミー値(実際の疎通は行わない)
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PLATFORM_FEE_RATE: "0.07"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      RESEND_API_KEY: re_dummy
      EMAIL_FROM: CycleX <noreply@example.com>
      CRON_SECRET: dummy-cron-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: setup-hosted.sql が migrations と一致するか
        run: node scripts/gen-setup-hosted.mjs && git diff --exit-code -- supabase/setup-hosted.sql

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # E2E は Supabase ローカルスタックが必要なため別ジョブに分ける
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Supabase
        run: pnpm supabase start -x studio,logflare,vector,supavisor,edge-runtime,realtime,postgres-meta

      - name: Run E2E smoke test
        run: |
          export NEXT_PUBLIC_SUPABASE_URL=$(pnpm supabase status -o json | jq -r '.API_URL')
          export NEXT_PUBLIC_SUPABASE_ANON_KEY=$(pnpm supabase status -o json | jq -r '.ANON_KEY')
          export SUPABASE_SERVICE_ROLE_KEY=$(pnpm supabase status -o json | jq -r '.SERVICE_ROLE_KEY')
          export NEXT_PUBLIC_APP_URL=http://localhost:3000
          export PLATFORM_FEE_RATE=0.07
          # E2E は Stripe 未構成のデモ決済で取引を通す(STRIPE_SECRET_KEY は設定しない)
          export ALLOW_DEMO_CHECKOUT=1
          export STRIPE_WEBHOOK_SECRET=whsec_dummy
          export RESEND_API_KEY=re_dummy
          export EMAIL_FROM="CycleX <noreply@example.com>"
          export CRON_SECRET=dummy-cron-secret
          # 絞り込み・ページ送りのテストが前提にする出品を入れておく
          node scripts/seed-users.mjs
          node scripts/seed-dev.mjs 60
          pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

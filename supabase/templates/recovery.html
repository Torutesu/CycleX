<!doctype html>
<html lang="ja">
<body style="margin:0;padding:24px;background:#F7FAF9;font-family:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;color:#1E2422;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px;">
    <p style="margin:0 0 20px;font-size:18px;font-weight:700;color:#0E7C6B;">BicycleMarket</p>
    <p style="margin:0 0 16px;font-size:14px;line-height:1.8;">パスワード再設定のお申し込みを受け付けました。</p>
    <p style="margin:0 0 16px;font-size:14px;line-height:1.8;">下のボタンから、新しいパスワードを設定してください。</p>
    <p style="margin:24px 0;">
      <a href="{{ .ConfirmationURL }}"
         style="display:inline-block;background:#0E7C6B;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;">
        パスワードを再設定する
      </a>
    </p>
    <p style="margin:0;font-size:13px;color:#5C6663;line-height:1.8;">リンクには有効期限があります。お申し込みに心当たりがない場合は、何もしなくて大丈夫です。パスワードは変わりません。</p>
    <p style="margin:16px 0 0;font-size:12px;color:#5C6663;line-height:1.8;">
      ボタンが押せない場合は、次の URL をブラウザに貼り付けてください。<br>
      <span style="word-break:break-all;">{{ .ConfirmationURL }}</span>
    </p>
    <hr style="margin:24px 0 16px;border:none;border-top:1px solid #DFE8E4;">
    <p style="margin:0;font-size:11px;color:#5C6663;line-height:1.7;">
      このメールは BicycleMarket から自動送信されています。<br>
      心当たりがない場合は、このメールを破棄してください。
    </p>
  </div>
</body>
</html>
